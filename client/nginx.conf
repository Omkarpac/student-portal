server {
    listen 80;

    # ── Serve the React app ──
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # try_files falls back to index.html so React can take over routing.
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy API calls to the backend ──
    # Requests to /api/... get forwarded to the backend container.
    # "backend" is the service name — it resolves to the backend
    # container via Docker's built-in DNS (set up in tomorrow's compose file).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
    }
}