# A Deployment for the backend API.
apiVersion: apps/v1          # the API group/version for Deployments
kind: Deployment             # what we're creating
metadata:
  name: backend              # the Deployment's name
  labels:
    app: backend
spec:
  replicas: 2                # ★ desired state: always keep 2 pods running
  selector:
    matchLabels:
      app: backend           # this Deployment manages pods with label app=backend
  template:                  # ── the POD blueprint the Deployment stamps out ──
    metadata:
      labels:
        app: backend         # every pod gets this label (must match selector above)
    spec:
      containers:
        - name: backend
          image: omkarpacho/student-portal-api:v1   # ★ your Day-5 Hub image
          ports:
            - containerPort: 3000
          env:                                        # config via env vars
            - name: DB_HOST
              value: "db"                             # placeholder — no DB in-cluster yet (Day 9)
            - name: DB_PORT
              value: "3306"
            - name: PORT
              value: "3000"
          resources:                                  # ★ good practice: bound resource use
            requests:                                 # what the pod is guaranteed
              memory: "64Mi"
              cpu: "50m"                              # 50 millicores = 0.05 CPU
            limits:                                   # the hard ceiling
              memory: "128Mi"
              cpu: "200m"