# A Deployment for the backend API.
apiVersion: apps/v1          # the API group/version for Deployments
kind: Deployment             # what we're creating
metadata:
  name: backend              # the Deployment's name
  labels:
    app: backend
spec:
  replicas: 2                # ★ desired state: always keep 2 pods running
  selector:
    matchLabels:
      app: backend           # this Deployment manages pods with label app=backend
  template:                  # ── the POD blueprint the Deployment stamps out ──
    metadata:
      labels:
        app: backend         # every pod gets this label (must match selector above)
    spec:
      containers:
        - name: backend
          image: omkarpacho/student-portal-api:v1  
          ports:
            - containerPort: 3000
          env:                                        # config via env vars
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: db-config, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: db-config, key: DB_PORT }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: db-config, key: DB_NAME }
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-secret, key: DB_PASSWORD }
            - name: PORT
              value: "3000"